<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110">
  <style>
    .text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 64px;
      font-weight: 800;
      fill: #ff9000;
      letter-spacing: 2px;
    }
    .cursor {
      fill: #ff9000;
      animation: blink 1s step-end infinite;
    }
    /* Маска-«шторка»: ширина 0 -> полная строка -> назад до Sweetie -> снова вперёд до SweetieCodes */
    .reveal {
      animation: type 8s steps(1, end) infinite;
    }
    @keyframes type {
      0%   { width: 0; }        /* пусто */
      20%  { width: 300px; }    /* SweetieF напечатан (~8 символов) */
      40%  { width: 300px; }    /* пауза на SweetieF */
      50%  { width: 260px; }    /* F удалён -> Sweetie */
      60%  { width: 260px; }    /* пауза на Sweetie */
      85%  { width: 460px; }    /* дописан Codes -> SweetieCodes */
      100% { width: 460px; }    /* пауза, затем цикл */
    }
    @keyframes blink {
      0%, 50%   { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="clip">
      <rect class="reveal" x="0" y="0" height="110" />
    </clipPath>
  </defs>

  <!-- Текст, который «проявляется» слева направо -->
  <g clip-path="url(#clip)">
    <text class="text" x="20" y="80">SweetieCodes</text>
  </g>

  <!-- Курсор (едет вместе с краем маски) -->
  <rect class="cursor" x="0" y="20" width="6" height="70">
    <animate attributeName="x" dur="8s" repeatCount="indefinite"
      values="20;320;320;280;280;480;480"
      keyTimes="0;0.2;0.4;0.5;0.6;0.85;1" />
  </rect>
</svg>
